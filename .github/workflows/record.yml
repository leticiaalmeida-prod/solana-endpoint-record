name: record
on:
  schedule:
    - cron: "7 * * * *"    # hourly checks
    - cron: "37 4 * * *"   # daily: refresh catalogs, check everything else
    - cron: "37 10,16,22 * * *"  # literal agent three more times a day (METHOD.md change 24)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: record
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh catalogs (daily)
        if: github.event.schedule == '37 4 * * *' || github.event_name == 'workflow_dispatch'
        run: python record/collect.py
      - name: Check the daily tier
        if: github.event.schedule == '37 4 * * *' || github.event_name == 'workflow_dispatch'
        run: python record/knock.py daily
      - name: Literal agent (four times a day; validation/METHOD.md section 9, change 24)
        if: github.event.schedule == '37 4 * * *' || github.event.schedule == '37 10,16,22 * * *' || github.event_name == 'workflow_dispatch'
        run: python record/literal.py
      - name: Check the hourly tier
        run: python record/knock.py hourly
      - name: Re-check the validation sample (until 2026-10-07 05:00 UTC)
        run: python validation/repeat.py validation/2026-10-06 github-us
      - name: Build page data
        run: python record/page_data.py
      - name: Save
        run: |
          git config user.name "record-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data validation/2026-10-06/repeats.jsonl
          git diff --cached --quiet && exit 0
          git commit -m "checks $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase
          git push
